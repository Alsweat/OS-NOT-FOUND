name: Build ISO

# Builds the bootable ISO in GitHub's cloud and uploads it as a
# downloadable artifact. Easiest path — no local Linux needed.
#
# How to use:
#   1. Create a new GitHub repo and push this whole folder to it.
#   2. Open the repo -> "Actions" tab -> "Build ISO" -> "Run workflow".
#   3. Wait ~30-60 min. When it's green, open the run and download the
#      "parrot-404-iso" artifact (a .zip containing the .iso).
#   4. On a tag push (e.g. git tag v1.0 && git push --tags) it also
#      publishes a GitHub Release with the ISO attached.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build ca-certificates

      - name: Build ISO
        run: |
          sudo lb config
          sudo lb build
          ls -lh ./*.iso

      - name: Rename ISO
        run: |
          iso=$(ls *.iso | head -1)
          sudo mv "$iso" 404-not-found-os-amd64.iso
          sha256sum 404-not-found-os-amd64.iso | tee 404-not-found-os-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: parrot-404-iso
          path: |
            404-not-found-os-amd64.iso
            404-not-found-os-amd64.iso.sha256
          retention-days: 14

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            404-not-found-os-amd64.iso
            404-not-found-os-amd64.iso.sha256
